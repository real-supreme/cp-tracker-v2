coc:
  base_url: "https://api.clashofclans.com/v1"
  request_timeout_seconds: 15
  max_retries: 3
  throttle_retry_seconds: 60
  service_unavailable_pause_seconds: 1800
  assumed_p95_latency_seconds: 0.8
  coc_key_name: "Clash Panda Tracker"
  per_worker_rate_per_second: 40

throttling:
  requests_per_second_per_key: 30
  effective_rate_pct_of_max: 1.0
  max_concurrent_requests: null
  rpm_halve_enabled: true
  rpm_halve_threshold_pct: 5
  rpm_halve_window_seconds: 60
  rpm_halve_recovery_seconds: 300

polling:
  auto_workers: true
  clan_workers: null
  player_workers: null
  war_workers: null
  write_batch_size: 50
  stale_claim_seconds: 300

  clan:
    budget_fraction: 0.40
    min_interval_seconds: 120
    max_interval_seconds: 900
    calls_per_entity: 1
  player:
    budget_fraction: 0.45
    min_interval_seconds: 60
    max_interval_seconds: 900
    calls_per_entity: 1
  war:
    budget_fraction: 0.15
    min_interval_seconds: 120
    max_interval_seconds: 600
    calls_per_entity: 1

  adaptive_intervals:
    enabled: true
    stable_threshold_1: 3
    stable_threshold_2: 6

priority:
  weight_access: 1.0
  weight_diff: 2.0
  diff_rate_cap: 0.5
  access_decay_hours: 24
  diff_window_hours: 1

cwl:
  cooldown_days: 15

tracking:
  fastapi_priority: 100
  scheduled_priority: 50
  default_ttl_days: 365
  cleanup_interval_seconds: 3600
  dead_entity_purge_days: 90

api:
  client_rpm_limit: 120
  stats_require_auth: true

alerts:
  email_cooldown_seconds: 3600

server:
  host: "0.0.0.0"
  port: 8000
  cors_origins: []
  behind_tls: true

logging:
  level: "INFO"

init:
  clans: []
  players: []