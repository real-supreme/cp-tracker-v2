upstream tracker_backend {
    server app:8000;
    keepalive 64;
}

# Per-IP rate limit for the API.
limit_req_zone $binary_remote_addr zone=tracker_api:20m rate=10r/s;

# Redirect HTTP -> HTTPS
server {
    listen 80;
    server_name _;
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # Drop your cert files here (nginx/certs mounted read-only).
    # Self-signed or Let's Encrypt — no Cloudflare dependency.
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Health check — no auth, no rate limit.
    location = /api/v1/health {
        proxy_pass http://tracker_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 5s;
    }

    # Everything else: rate-limited reverse proxy.
    location /api/ {
        limit_req zone=tracker_api burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://tracker_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 10s;
    }

    location = / {
        return 404;
    }
}