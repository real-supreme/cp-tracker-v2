[project]
name = "clash-panda-tracker"
version = "0.2.0"
description = "Async Clash of Clans tracking backend"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "Emmanuel Smiju (real-supreme)" }]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "python-json-logger>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"